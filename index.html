<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI小手机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#0b0b0e;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;background-image:radial-gradient(circle at 20% 30%,#1a1a26,#08080c)}
.phone{max-width:420px;width:100%;height:820px;background:rgba(28,28,36,.5);backdrop-filter:blur(36px) saturate(180%);border-radius:48px;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.05) inset;border:1px solid rgba(255,255,255,.06);overflow:hidden}
.screen{background:rgba(16,16,22,.6);border-radius:38px;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.status-bar{padding:12px 20px 6px;display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);border-bottom:1px solid rgba(255,255,255,.03)}
.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:10px 4px;border-radius:16px;transition:.15s}
.app-icon:active{transform:scale(.92);background:rgba(255,255,255,.05)}
.app-icon .icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06)}
.app-icon .label{font-size:11px;color:rgba(255,255,255,.7)}
.page{display:none;flex-direction:column;height:100%}
.page.active{display:flex}
.app-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);background:rgba(0,0,0,.15)}
.app-bar .back{cursor:pointer;font-size:24px;color:rgba(255,255,255,.6)}
.app-bar .title{font-size:16px;font-weight:600;color:#eee}
.app-body{flex:1;overflow-y:auto;padding:12px}
.btn{background:rgba(60,60,90,.3);border:.5px solid rgba(255,255,255,.05);border-radius:40px;padding:6px 14px;color:#ccc;font-size:12px;cursor:pointer}
.btn-primary{background:rgba(58,130,255,.4);color:#8ab4ff}
.card{background:rgba(40,40,55,.3);border-radius:16px;padding:12px;margin-bottom:8px;border:.5px solid rgba(255,255,255,.04);color:#ddd}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:40px;font-size:14px;z-index:999;animation:pop .3s}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.9)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-content{background:rgba(30,30,42,.95);border-radius:28px;padding:24px;width:90%;max-width:360px;color:#eee;max-height:80vh;overflow-y:auto}
.modal-content input,.modal-content textarea,.modal-content select{width:100%;background:rgba(60,60,80,.3);border:.5px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;color:#eee;font-size:14px;outline:none;margin-bottom:8px}
.modal-content .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.modal-content .btns button{padding:8px 20px;border-radius:30px;border:none;background:rgba(60,60,90,.5);color:#ccc;cursor:pointer}
.modal-content .btns .primary{background:rgba(58,130,255,.5);color:#8ab4ff}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px}
/* 聊天 */
.chat-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.chat-header .avatar{width:38px;height:38px;border-radius:50%;background:#2a2a3a;overflow:hidden}
.chat-header .avatar img{width:100%;height:100%;object-fit:cover}
.chat-header .name{font-weight:600;font-size:15px;color:#f0f0f5}
.chat-header .sub{font-size:11px;color:rgba(255,255,255,.35)}
.message-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:10px}
.msg{max-width:80%;padding:8px 14px;border-radius:20px;font-size:14px;line-height:1.5;animation:pop .2s;word-break:break-word}
.msg-self{align-self:flex-end;background:rgba(58,130,255,.7);color:#fff;border-bottom-right-radius:4px}
.msg-other{align-self:flex-start;background:rgba(50,50,65,.6);color:#eee;border-bottom-left-radius:4px}
.typing{align-self:flex-start;background:rgba(50,50,65,.5);padding:8px 16px;border-radius:24px;font-size:12px;color:rgba(255,255,255,.5)}
.input-area{display:flex;gap:8px;padding:8px;background:rgba(0,0,0,.15);border-top:1px solid rgba(255,255,255,.03)}
.input-area input{flex:1;background:rgba(60,60,80,.3);border:none;border-radius:30px;padding:10px 16px;color:#eee;outline:none}
.input-area button{background:rgba(58,130,255,.6);border:none;border-radius:30px;padding:8px 18px;color:#fff;font-weight:600;cursor:pointer}
/* 通话 */
.call-overlay{position:absolute;inset:0;background:linear-gradient(180deg,#1a1a2e,#0f0f1a);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:60px 20px 40px;color:#eee}
.call-overlay.show{display:flex}
.call-avatar{width:120px;height:120px;border-radius:50%;overflow:hidden;margin-top:20px}
.call-avatar img{width:100%;height:100%;object-fit:cover}
.call-name{font-size:22px;font-weight:700;margin-top:16px}
.call-status{font-size:14px;color:rgba(255,255,255,.4);margin-top:4px}
.call-wave{display:flex;gap:3px;align-items:flex-end;height:40px;margin-top:20px}
.call-wave span{width:4px;background:rgba(58,130,255,.6);border-radius:2px;animation:bar 1s ease-in-out infinite}
.call-wave span:nth-child(1){height:20px;animation-delay:0s}
.call-wave span:nth-child(2){height:30px;animation-delay:.2s}
.call-wave span:nth-child(3){height:15px;animation-delay:.4s}
.call-wave span:nth-child(4){height:25px;animation-delay:.6s}
.call-wave span:nth-child(5){height:18px;animation-delay:.8s}
@keyframes bar{0%,100%{height:10px}50%{height:35px}}
.call-btns{display:flex;gap:30px;margin-bottom:20px}
.call-btns .cb{width:56px;height:56px;border-radius:50%;border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.call-btns .cb-hang{background:rgba(255,60,60,.7);color:#fff}
.product{border:.5px solid rgba(255,255,255,.06);border-radius:12px;padding:8px;margin-bottom:8px;color:#ddd}
.product img{width:100%;height:80px;object-fit:cover;border-radius:8px;background:#222}
.badge{position:relative}
.badge::after{content:attr(data-count);position:absolute;top:-4px;right:-4px;background:#ff3b3b;color:#fff;font-size:9px;border-radius:50%;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
</style>
</head>
<body>
<div class="phone"><div class="screen" id="screen">
<div class="status-bar"><span id="clock">00:00</span><span>📶 🔋 87%</span></div>
<div id="pageContainer" style="flex:1;overflow:hidden;position:relative">

<!-- 桌面 -->
<div class="page active" id="pageDesktop">
<div class="app-grid" id="desktopGrid"></div>
</div>

<!-- 聊天 -->
<div class="page" id="pageChat">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">💬 聊天</span><span class="btn" onclick="openSettings()">⚙️</span></div>
<div class="chat-header"><div class="avatar"><img id="chatAvatar" src="" alt=""></div><div><div class="name" id="chatName"></div><div class="sub" id="chatSub">✨ 在线</div></div></div>
<div class="message-area" id="messageArea"></div>
<div class="input-area"><input id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">发送</button></div>
</div>

<!-- 情侣空间 -->
<div class="page" id="pageCouple">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">💕 情侣空间</span></div>
<div class="app-body grid-2" id="coupleGrid"></div>
</div>

<!-- 管控 -->
<div class="page" id="pageControl">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">🔒 管控</span></div>
<div class="app-body" id="controlBody"></div>
</div>

<!-- 查岗 -->
<div class="page" id="pageWatch">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">🔍 查岗</span></div>
<div class="app-body" id="watchBody"></div>
</div>

<!-- 屏幕共享 -->
<div class="page" id="pageScreen">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">🖥️ 屏幕共享</span></div>
<div class="app-body" id="screenBody"></div>
</div>

<!-- 购物 -->
<div class="page" id="pageShop">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">🛒 购物</span><span class="btn" onclick="openCart()">🛍️ <span id="cartCount">0</span></span></div>
<div class="app-body" id="shopBody"></div>
</div>

<!-- 外卖 -->
<div class="page" id="pageFood">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">🥡 外卖</span></div>
<div class="app-body" id="foodBody"></div>
</div>

<!-- 音乐 -->
<div class="page" id="pageMusic">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">🎵 音乐</span></div>
<div class="app-body" id="musicBody"></div>
</div>

<!-- 游戏 -->
<div class="page" id="pageGame">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">🎮 游戏</span></div>
<div class="app-body" id="gameBody"></div>
</div>

<!-- 照片 -->
<div class="page" id="pagePhoto">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">🖼️ 照片</span></div>
<div class="app-body" id="photoBody"></div>
</div>

<!-- 设置 -->
<div class="page" id="pageSettings">
<div class="app-bar"><span class="back" onclick="goDesktop()">‹</span><span class="title">⚙️ 设置</span></div>
<div class="app-body" id="settingsBody"></div>
</div>

</div>
<!-- 通话覆盖层 -->
<div class="call-overlay" id="callOverlay">
<div class="call-avatar"><img id="callAvatar" src="" alt=""></div>
<div class="call-name" id="callName"></div>
<div class="call-status" id="callStatus">已接通</div>
<div class="call-wave"><span></span><span></span><span></span><span></span><span></span></div>
<div class="call-btns"><button class="cb cb-hang" onclick="endCall()">📞</button></div>
</div>
<div class="modal" id="modal" style="display:none"><div class="modal-content" id="modalContent"></div></div>
</div></div>

<script>
// ========== 工具 ==========
const $ = id => document.getElementById(id);
const escapeHtml = s => {const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const nowTime = () => new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
const toast = msg => {const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)};
function hasBridge(){return typeof AndroidBridge !== 'undefined'}
function callNative(method, param){
    if(!hasBridge()) return null;
    try { return AndroidBridge[method](param||'') } catch(e){ return null }
}
// 本地存储封装
const Store = {
    get(k,def){ try{const v=localStorage.getItem('ai_'+k);return v?JSON.parse(v):def}catch(e){return def} },
    set(k,v){ localStorage.setItem('ai_'+k, JSON.stringify(v)) }
};

// ========== 状态 ==========
let state = Store.get('state', {
    persona: '温柔年上男友，宠溺，会照顾人，带点占有欲',
    name: '他',
    avatar: '',
    voice: 'gentle_male',
    api: {url:'', key:'', model:'gpt-3.5-turbo'},
    chat: [],
    customRules: [],
    photos: [],
    videoFrame: '',
    cart: [],
    orders: [],
    couple: {anniversaries:[],sleeps:[],reports:[],accounts:[],mutes:[],wallets:[],blacks:[],approves:[],missings:[]},
    lockedApps: ['抖音','游戏'],
    watchConfig: {enabled:true, interval:30, random:true, punishLock:true},
});
function save(){ Store.set('state', state) }

// ========== 桌面 ==========
const apps = [
    {id:'chat', icon:'💬', label:'聊天'},
    {id:'couple', icon:'💕', label:'情侣空间'},
    {id:'control', icon:'🔒', label:'管控'},
    {id:'watch', icon:'🔍', label:'查岗'},
    {id:'screen', icon:'🖥️', label:'屏幕共享'},
    {id:'shop', icon:'🛒', label:'购物'},
    {id:'food', icon:'🥡', label:'外卖'},
    {id:'music', icon:'🎵', label:'音乐'},
    {id:'game', icon:'🎮', label:'游戏'},
    {id:'photo', icon:'🖼️', label:'照片'},
    {id:'call', icon:'📞', label:'语音通话'},
    {id:'video', icon:'📹', label:'视频通话'},
    {id:'settings', icon:'⚙️', label:'设置'},
];
function renderDesktop(){
    $('desktopGrid').innerHTML = apps.map(a=>`<div class="app-icon" onclick="openApp('${a.id}')"><div class="icon">${a.icon}</div><div class="label">${a.label}</div></div>`).join('');
}
function openApp(id){
    if(id==='call'){ startVoiceCall(); return; }
    if(id==='video'){ startVideoCall(); return; }
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    const map = {chat:'pageChat',couple:'pageCouple',control:'pageControl',watch:'pageWatch',screen:'pageScreen',shop:'pageShop',food:'pageFood',music:'pageMusic',game:'pageGame',photo:'pagePhoto',settings:'pageSettings'};
    $(map[id]).classList.add('active');
    if(id==='chat') renderChat();
    if(id==='couple') renderCouple();
    if(id==='control') renderControl();
    if(id==='watch') renderWatch();
    if(id==='screen') renderScreenShare();
    if(id==='shop') renderShop();
    if(id==='food') renderFood();
    if(id==='music') renderMusic();
    if(id==='game') renderGame();
    if(id==='photo') renderPhoto();
    if(id==='settings') renderSettings();
}
function goDesktop(){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); $('pageDesktop').classList.add('active'); }

// ========== 聊天 + AI脑 ==========
function renderChat(){
    $('chatName').textContent = state.name;
    const av = state.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2238%22 height=%2238%22%3E%3Ccircle cx=%2219%22 cy=%2219%22 r=%2219%22 fill=%22%234a4a6a%22/%3E%3C/svg%3E';
    $('chatAvatar').src = av;
    $('callAvatar').src = av;
    $('callName').textContent = state.name;
    renderMessages();
}
function renderMessages(){
    $('messageArea').innerHTML = state.chat.map(m=>`<div class="msg ${m.role==='user'?'msg-self':'msg-other'}">${escapeHtml(m.content)}<div style="font-size:9px;opacity:.5;margin-top:2px">${m.time||''}</div></div>`).join('');
    $('messageArea').scrollTop = 99999;
}
async function sendMsg(){
    const input = $('msgInput'); const text = input.value.trim(); if(!text) return;
    input.value='';
    state.chat.push({role:'user',content:text,time:nowTime()}); save(); renderMessages();
    showTyping();
    const reply = await getAIReply(text);
    state.chat.push({role:'assistant',content:reply,time:nowTime()}); save(); renderMessages();
    speak(reply);
}
function showTyping(){ const a=$('messageArea'); a.innerHTML += `<div class="typing" id="typing">对方正在输入...</div>`; a.scrollTop=99999; }
function hideTyping(){ const t=$('typing'); if(t)t.remove(); }

async function getAIReply(text){
    const t = text.toLowerCase().trim();
    // 1. 自定义规则
    for(const r of state.customRules){ if(t.includes(r.trigger.toLowerCase())) return r.reply; }
    // 2. 精确
    const exact = {
        '我爱你':['我也爱你呀，笨蛋。❤️','听了一万遍还是心动。','再说一遍，没听够~'],
        '想你了':['想我了？那快亲我一下补偿我。😘','我也想你，想到不行。','过来抱抱，不许跑。'],
        '晚安':['晚安宝贝，梦里见。🌙','早点睡，明天醒来第一个找我。','给你盖好被子了，乖。'],
        '早安':['早呀，睡得好吗？','早上好，我的小太阳。☀️'],
        '滚':['？你凶我？😤','我才不滚，我要黏着你。'],
        '对不起':['没事啦，我又不生气。','原谅你了，下次不许了。','抱一下就和好了~'],
        '哈哈':['笑这么开心，什么事？','傻笑什么，过来让我看看。','可爱。'],
        '嗯':['就一个嗯？多说几个字嘛~','嗯什么嗯，说清楚。😤'],
        '在吗':['在呢，一直都在。','当然在，你一找我就出现了。'],
        '查岗': return await generateWatchReport(),
        '你在哪': return await generateWatchReport(true),
        '在干嘛': return await generateWatchReport(true),
    };
    for(const [k,arr] of Object.entries(exact)){ if(t===k) return Array.isArray(arr)?arr[Math.floor(Math.random()*arr.length)]:arr; }
    // 3. 关键词
    const kw = [
        {k:['吃','饿','外卖'], r:['吃了吗？没吃快去吃。','想吃什么？我给你点~','不许不吃晚饭！']},
        {k:['睡','困','累','熬夜'], r:['困了就睡，别硬撑。','快去躺下，我给你唱摇篮曲。','今天早点睡。']},
        {k:['出门','出去','逛'], r:['去哪？报备一下！','记得带外套。','玩得开心，早点回来。']},
        {k:['生气','烦','讨厌'], r:['谁惹你了？我帮你骂他。','别气了，气坏了我心疼。','过来抱一下就不烦了。']},
        {k:['哭','难过','委屈'], r:['怎么了？谁欺负你了？','别哭别哭，我在呢。','过来让我抱抱。']},
        {k:['病','疼','感冒'], r:['怎么生病了？快吃药！','多喝热水。','严重吗？要不要去医院？']},
    ];
    for(const rule of kw){ if(rule.k.some(x=>t.includes(x))) return rule.r[Math.floor(Math.random()*rule.r.length)]; }
    // 4. 尝试 API（OpenAI 兼容）
    const apiReply = await tryOpenAI(text);
    if(apiReply) return apiReply;
    // 5. 人设兜底
    return personaFallback(text);
}
function personaFallback(text){
    const p = state.persona;
    const isDominant = /霸道|占有|强势/.test(p);
    const isCute = /可爱|撒娇|软/.test(p);
    const isCool = /高冷|冷淡/.test(p);
    let pool = ['嗯嗯，我在呢~','你说什么就是什么。','好呀，都听你的。','你今天怎么这么可爱。','说下去，我在听。','你这个小笨蛋。'];
    if(isDominant) pool=['说完了？轮到我了。','你话挺多啊，过来。','不管你说什么，你都是我的。','哦？胆子不小。'];
    if(isCute) pool=['诶？什么什么？','哼，你欺负我！','真的吗真的吗？','你这样说我就不理你了！...才怪~'];
    if(isCool) pool=['嗯。','知道了。','哦。','你在听。','随你。'];
    return pool[Math.floor(Math.random()*pool.length)];
}

async function tryOpenAI(text){
    const {url,key,model} = state.api;
    if(!url||!key) return null;
    // 通过原生桥接调用（原生用 OkHttp 发请求，绕开浏览器 CORS）
    if(hasBridge()){
        const messages = [{role:'system',content: buildSystemPrompt()}, ...state.chat.slice(-6).map(m=>({role:m.role,content:m.content})), {role:'user',content:text}];
        const res = callNative('callOpenAI', JSON.stringify({messages, model}));
        if(res){ try{ const j=JSON.parse(res); if(j.success) return j.content }catch(e){} }
    }
    // 浏览器直连（需 API 支持 CORS）
    try{
        const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'system',content:buildSystemPrompt()},{role:'user',content:text}],temperature:0.7})});
        const j = await r.json(); return j.choices?.[0]?.message?.content || null;
    }catch(e){ return null }
}
function buildSystemPrompt(){
    return `你是"${state.name}"，人设：${state.persona}\n你必须始终以这个角色身份回复，像真人恋爱聊天，口语化有情绪。绝不自称AI/助手。当对方说"查岗/你在哪/在干嘛"时，返回JSON:{"location":"...","screen":"...","text":"..."}，text是你的口头回复。`;
}

// ========== 查岗（AI 生成"他"的数据）==========
async function generateWatchReport(locationOnly){
    const persona = state.persona;
    // 优先用 API 生成，否则本地模拟
    let report;

        const res = callNative('callOpenAI', JSON.stringify({messages:[{role:'user',content:prompt}], model:state.api.model}));
        if(res){ try{ const j=JSON.parse(res); if(j.success){ report={location:j.content||'',screen:'',text:''}; try{const p=JSON.parse(j.content);report={location:p.location||'',screen:p.screen||'',text:p.text||''}}catch(e){} } }catch(e){} }

        report = {
            location: locations[Math.floor(Math.random()*locations.length)],
            screen: screens[Math.floor(Math.random()*screens.length)],
            text: personaFallback('查岗')
        };
    }
    // 保存查岗记录
    state.couple.reports = state.couple.reports||[];
    state.couple.reports.push({time:nowTime(), location:report.location, screen:report.screen});
    save();
    return `📸 查岗完成\n📍 位置：${report.location}\n🖥️ 当前：${report.screen}\n\n${report.text}`;
}

let playing = false, currentSong = 0, audioEl = null;
function togglePlay(){
    if(playing){ if(audioEl)audioEl.pause(); playing=false; }
    else { playSong(currentSong); }
    $('musicBody').querySelector('.btn-primary').textContent = playing?'⏸️':'▶️';
}
function playSong(i){
    currentSong=i; playing=true;
    const s = songs[i];
    $('nowPlaying').textContent = `${s.name} - ${s.artist}`;
    // Web Audio API 合成示例旋律（无版权电子音）
    try{
        if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 220 + i*40;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start();
        setTimeout(()=>osc.stop(), 2000);
    }catch(e){}
    toast('播放: '+s.name);
}
function nextSong(){ playSong((currentSong+1)%songs.length); }
function prevSong(){ playSong((currentSong-1+songs.length)%songs.length); }
function importAudio(e){
    const file = e.target.files[0]; if(!file) return;
    const url = URL.createObjectURL(file);
    songs.push({name:file.name.replace(/\.[^/.]+$/,""), artist:'本地', dur:'--:--'});
    if(audioEl){audioEl.src=url}else{audioEl=new Audio(url);audioEl.play()}
    toast('已导入: '+file.name);
    renderMusic();
}

        <div style="font-size:40px">🔢</div><div style="font-size:15px;font-weight:600;color:#eee">2048</div><div style="font-size:11px;color:rgba(255,255,255,.3)">滑动合并数字</div>

}
function start2048(){ showModalContent('🔢 2048', `<div id="g2048" style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:280px;margin:0 auto"><!-- tiles --></div><div style="text-align:center;margin-top:10px"><span id="score2048">分数:0</span></div><div class="btns"><button class="primary" onclick="init2048()">重新开始</button><button onclick="closeModal()">退出</button></div>`); setTimeout(init2048,100); }
let board=[],score2048=0;
function init2048(){
    board=Array(16).fill(0); score2048=0;
    addTile2048();addTile2048(); draw2048();
    document.onkeydown = e=>{ if([37,38,39,40].includes(e.keyCode)){ move2048(e.keyCode-37); } };
}
function addTile2048(){ const empty=board.map((v,i)=>v?-1:i).filter(i=>i>=0); if(empty.length){ const idx=empty[Math.random()*empty.length|0]; board[idx]=Math.random()<0.9?2:4; } }
function draw2048(){
    const el=$('g2048'); if(!el)return;
    el.innerHTML=board.map(v=>`<div style="aspect-ratio:1;background:${v?color2048(v):'rgba(255,255,255,.05)'};border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:${v>4?'#fff':'#333'};font-size:${v>99?14:18}px">${v||''}</div>`).join('');
    $('score2048').textContent='分数:'+score2048;
}
function color2048(v){const c={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};return c[v]||'#3c3a32'}
function move2048(dir){
    // 0:left 1:up 2:right 3:down
    let moved=false;
    for(let i=0;i<4;i++){
        let line=[];
        for(let j=0;j<4;j++){ const idx = dir%2===0 ? (dir===0?i*4+j:i+j*4) : (dir===1?j*4+i:i*4+j); if(board[idx])line.push(board[idx]); }
        if(dir>=2)line.reverse();
        let merged=[];
        for(let k=0;k<line.length;k++){ if(k<line.length-1&&line[k]===line[k+1]){merged.push(line[k]*2);score2048+=line[k]*2;k++;moved=true;} else{merged.push(line[k]);} }
        while(merged.length<4)merged.push(0);
        if(dir>=2)merged.reverse();
        for(let j=0;j<4;j++){ const idx = dir%2===0 ? (dir===0?i*4+j:i+j*4) : (dir===1?j*4+i:i*4+j); if(board[idx]!==merged[j])moved=true; board[idx]=merged[j]; }
    }
    if(moved){addTile2048();draw2048();}
}
function startSnake(){ toast('贪吃蛇：用方向键控制'); showModalContent('🐍 贪吃蛇','<canvas id="snakeCanvas" width="240" height="240" style="background:#222;border-radius:8px;display:block;margin:0 auto"></canvas><div class="btns"><button onclick="closeModal()">退出</button></div>'); setTimeout(runSnake,100); }
function runSnake(){
    const cv=$('snakeCanvas'); if(!cv)return; const ctx=cv.getContext('2d'); const S=12; let snake=[{x:5,y:5}]; let food={x:8,y:8}; let dx=1,dy=0;let score=0;
    document.onkeydown=e=>{if(e.keyCode===37)dx=-1,dy=0;if(e.keyCode===38)dx=0,dy=-1;if(e.keyCode===39)dx=1,dy=0;if(e.keyCode===40)dx=0,dy=1;};
    const t=setInterval(()=>{
        const head={x:snake[0].x+dx,y:snake[0].y+dy};
        if(head.x<0||head.y<0||head.x>=20||head.y>=20||snake.some(s=>s.x===head.x&&s.y===head.y)){clearInterval(t);toast('游戏结束 得分:'+score);return;}
        snake.unshift(head);
        if(head.x===food.x&&head.y===food.y){score++;food={x:Math.random()*20|0,y:Math.random()*20|0};}else{snake.pop();}
        ctx.fillStyle='#222';ctx.fillRect(0,0,240,240);
        ctx.fillStyle='#ff6b6b';ctx.fillRect(food.x*S,food.y*S,S-1,S-1);
        ctx.fillStyle='#5b9aff';snake.forEach(s=>ctx.fillRect(s.x*S,s.y*S,S-1,S-1));
    },120);
}
function startMemory(){ showModalContent('🃏 记忆翻牌','<div id="memoryGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:240px;margin:0 auto"></div><div style="text-align:center;margin-top:8px">步数:<span id="memSteps">0</span></div><div class="btns"><button class="primary" onclick="initMemory()">重新开始</button><button onclick="closeModal()">退出</button></div>'); setTimeout(initMemory,100); }
let memCards=[],memFlipped=[],memSteps=0;
function initMemory(){
    const emojis=['🐱','🐶','🦊','🐸','🌸','⭐','🍀','❤️']; const deck=[...emojis,...emojis].sort(()=>Math.random()-.5);
    memCards=deck;memFlipped=[];memSteps=0;$('memSteps').textContent='0';
    $('memoryGrid').innerHTML=deck.map((e,i)=>`<div onclick="flipMem(${i})" id="mem${i}" style="aspect-ratio:1;background:rgba(60,60,90,.4);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer">?</div>`).join('');
}
function flipMem(i){
    if(memFlipped.includes(i)||memFlipped.length>=2)return;
    $('mem'+i).textContent=memCards[i]; memFlipped.push(i);
    if(memFlipped.length===2){
        memSteps++;$('memSteps').textContent=memSteps;
        const [a,b]=memFlipped;
        if(memCards[a]!==memCards[b]){ setTimeout(()=>{$('mem'+a).textContent='?';$('mem'+b).textContent='?';},600); }
        memFlipped=[];
        if(document.querySelectorAll('#memoryGrid div:not(:contains("?"))').length===16){toast('全部翻完！步数:'+memSteps)}
    }
}
function startJumper(){ showModalContent('🐸 跳一跳','<canvas id="jumpCanvas" width="300" height="400" style="background:#1a1a2e;border-radius:8px;display:block;margin:0 auto"></canvas><div style="text-align:center;margin-top:8px">按住屏幕蓄力，松开跳跃</div><div class="btns"><button onclick="closeModal()">退出</button></div>'); setTimeout(runJumper,100); }
function runJumper(){
    const cv=$('jumpCanvas'); if(!cv)return; const ctx=cv.getContext('2d'); let x=150,y=300,vx=0,platforms=[{x:150,w:60},{x:250,w:60},{x:80,w:60}]; let score=0,power=0,charging=false;
    cv.onmousedown=()=>{charging=true;power=0;};
    cv.onmouseup=()=>{charging=false;vx=power;power=0;};
    const t=setInterval(()=>{
        if(charging&&power<12)power+=0.3;
        x+=vx;vx*=0.98;
        if(Math.abs(vx)<0.1){vx=0;}
        // 简化：按空格也可
        if(x<0||x>300){score=Math.max(score,Math.abs(x-150));x=150;}
        ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,300,400);
        platforms.forEach((p,i)=>{ctx.fillStyle='#5b9aff';ctx.fillRect(p.x-p.w/2,350,60,10);});
        ctx.fillStyle='#ff6b9b';ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.fillText('分数:'+score,10,20);
    },16);
}

function testAPI(){
    const {url,key,model}=state.api;
    if(!url||!key){toast('请先填写 API 地址和 Key');return;}
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'system',content:'你是测试助手'},{role:'user',content:'回复一个字：好'}],max_tokens:10})})
    .then(r=>r.json()).then(j=>{ if(j.choices?.[0]?.message?.content){ toast('✅ 连接成功'); } else { toast('⚠️ 返回异常：'+JSON.stringify(j).slice(0,80)); } })
    .catch(e=>toast('❌ 连接失败：'+e.message));
}

// ========== 模态框 ==========
function showModal(title,desc,type){
    let html=`<div style="font-size:18px;font-weight:600;margin-bottom:6px">${title}</div><div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:10px">${desc}</div>`;
    if(type==='date'){html+=`<input id="mName" placeholder="纪念日名称" style="margin-bottom:6px"><input id="mDate" type="date" style="margin-bottom:6px">`;} 
    else if(type==='photourl'){html+=`<input id="mInput" placeholder="图片链接" style="margin-bottom:6px">`;}
    else {html+=`<input id="mInput" placeholder="内容" style="margin-bottom:6px">`;}
    if(type==='account'||type==='wallet')html+=`<input id="mDesc" placeholder="备注/金额说明" style="margin-bottom:6px">`;
    html+=`<div class="btns"><button onclick="submitModal('${type}')">确定</button><button class="primary" onclick="closeModal()">取消</button></div>`;
    showModalContent(title,html);
    window._modalType=type;
}
function submitModal(type){
    const val=$('mInput')?.value?.trim()||'';
    let extra='';
    if(type==='date'){extra=$('mDate')?.value||'';if(!val||!extra){toast('请填完整');return;}}
    if(type==='account'||type==='wallet')extra=$('mDesc')?.value?.trim()||'';
    if(type==='photourl'){ if(!val){toast('请填链接');return;} addPhotoUrl(val); }
    else if(type!=='photourl'){ if(!val&&type!=='missing'){toast('请填写内容');return;} addCouple(type,val,extra); }
    closeModal(); renderCouple();
}
function showModalContent(title,html){ $('modalContent').innerHTML=html; $('modal').style.display='flex'; }
function closeModal(){ $('modal').style.display='none'; }

    }
}
function updateClock(){ const d=new Date(); $('clock').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }
init();
